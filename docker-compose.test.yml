# Docker Compose file for integration testing
# Usage:
#   make clickhouse-up / make test-clickhouse / make clickhouse-down

services:
  clickhouse:
    image: clickhouse/clickhouse-server:26.8
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: "1"
    ports:
      - "18123:8123"
      - "19000:9000"
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --query 'SELECT 1'"]
      interval: 2s
      timeout: 5s
      retries: 15
    tmpfs:
      - /var/lib/clickhouse
